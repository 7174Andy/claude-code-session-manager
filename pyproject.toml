[project]
name = "session-panel"
version = "0.1.0"
description = "Always-on-top panel listing every Claude Code session"
readme = "README.md"
authors = [
    { name = "7174Andy", email = "hee031011@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
    "winotify>=1.1.0; sys_platform == 'win32'",
]

[project.gui-scripts]
session-panel = "session_panel.app:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
